name: Test
run-name: Test, scan, and build '${{ github.head_ref }}' (${{ github.sha }})

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: environment
        required: true
        default: staging
      base-ref-sha:
        description: "Base/reference commit SHA-256"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Propagate TARGET_ENV variable and other data to other jobs by its output
  setup:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set-target-env.outputs.target_env }}
      short_sha: ${{ steps.set-short-sha.outputs.short_sha }}
      branch_name: ${{ steps.sanitize-branch-name.outputs.branch_name }}
    steps:
      - name: Set target environment
        id: set-target-env
        run: echo "target_env=${{ inputs.environment || 'staging' }}" >> $GITHUB_OUTPUT

      - name: Set short commit SHA
        id: set-short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

        # The artifact name cannot include these characters: Double quote ", Colon :, Less than <, Greater than >, Vertical bar |, Asterisk *, Question mark ?, Carriage return \r, Line feed \n, Backslash \, Forward slash /
      - name: Sanitize branch name
        id: sanitize-branch-name
        run: |
          raw="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "branch_name=$(echo "$raw" | sed 's/["<>:|*?\\\/\r\n]/_/g')" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target_env }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref-sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npm install playwright@1.50.1 --with-deps --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit -- --mode=${{ needs.setup.outputs.target_env }}

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report__${{ needs.setup.outputs.branch_name }}#${{ needs.setup.outputs.short_sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report__${{ needs.setup.outputs.branch_name }}#${{ needs.setup.outputs.short_sha }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  snyk-iac-scan:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target_env }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref-sha || github.sha }}

      - name: Run Snyk IaC to check for vulnerabilities
        uses: snyk/actions/iac@master
        id: snyk-iac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: terraform/
          args: --severity-threshold=high

      - name: Upload Snyk IaC result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif

  build:
    needs:
      - setup
      - test
      - snyk-iac-scan
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target_env }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref-sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Set environment variable
        run: export $(grep -v '^#' .env.${{ needs.setup.outputs.target_env }} | xargs)

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -- --mode=${{ needs.setup.outputs.target_env }}
