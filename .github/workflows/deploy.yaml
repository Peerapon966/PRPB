name: Deploy
run-name: Deploy commit '${{ github.head_ref && format('{0} ({1})', github.sha, github.head_ref) || github.sha }}' to ${{ inputs.environment || 'staging' }} environment

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: environment
        required: true
        default: staging
      base-ref-sha:
        description: "Base/reference commit SHA-256"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set-target-env.outputs.target_env }}
      short_sha: ${{ steps.set-short-sha.outputs.short_sha }}
      branch_name: ${{ steps.sanitize-branch-name.outputs.branch_name }}
    steps:
      - name: Set target environment
        id: set-target-env
        run: echo "target_env=${{ inputs.environment || 'staging' }}" >> $GITHUB_OUTPUT

      - name: Set short commit SHA
        id: set-short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

        # The artifact name cannot include these characters: Double quote ", Colon :, Less than <, Greater than >, Vertical bar |, Asterisk *, Question mark ?, Carriage return \r, Line feed \n, Backslash \, Forward slash /
      - name: Sanitize branch name
        id: sanitize-branch-name
        run: |
          raw="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "branch_name=$(echo "$raw" | sed 's/["<>:|*?\\\/\r\n]/_/g')" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      (github.event.pull_request.merged == true ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target_env }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base-ref-sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Set environment variable
        run: export $(grep -v '^#' .env.${{ needs.setup.outputs.target_env }} | xargs)

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -- --mode=${{ needs.setup.outputs.target_env}}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app__${{ needs.setup.outputs.branch_name }}#${{ needs.setup.outputs.short_sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  deploy:
    needs:
      - setup
      - build
    if: needs.setup.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target_env }}
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base-ref-sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app__${{ needs.setup.outputs.branch_name }}#${{ needs.setup.outputs.short_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ github.workspace }}/dist

      - name: Deploy Application
        uses: ./.github/actions/deploy
        with:
          tf-workspace: ${{ vars.TF_WORKSPACE }}
          environment: ${{ needs.setup.outputs.target_env }}
